<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dreamland NOC System</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Montserrat:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #000c1e; /* Dark Blue */
        --secondary: #1a2a40; /* Slightly Lighter Dark Blue */
        /* --neon-blue: #00f2ffaf;
            --neon-pink: #ff0080c8; */
        /* --neon-blue: #a2d2ff; 
        --neon-pink: #bde0fe;  */

        /* --neon-blue: #e0e1dd; 
        --neon-pink: #778da9;  */
        --neon-blue: #84a59d;
        --neon-pink: #f5cac3;
        --text-light: #e0e0e0;
        --glass-bg: rgba(255, 255, 255, 0.05);
        --border-neon: 1px solid rgba(0, 242, 255, 0.3);
        --shadow-neon: 0 0 15px rgba(0, 242, 255, 0.2);
      }

      body {
        font-family: "Cairo", sans-serif;
        margin: 0;
        background: linear-gradient(
          135deg,
          #000c1e,
          #1a001a
        ); /* Dark gradient background */
        color: var(--text-light);
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* Background animation - Optional but cool */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: url("merged_night_park.png") repeat; /* A subtle pattern or stars */
        opacity: 0.1;
        animation: bg-scroll 60s linear infinite;
      }
      @keyframes bg-scroll {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 100% 100%;
        }
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 30px;
        background: rgba(0, 0, 0, 0.6); /* Semi-transparent dark navbar */
        border-bottom: var(--border-neon);
        box-shadow: var(--shadow-neon);
        z-index: 1000;
      }

      .logo-text {
        font-family: "Montserrat", sans-serif;
        font-size: 28px;
        font-weight: 700;
        color: var(--neon-blue);
        text-shadow: 0 0 10px var(--neon-blue);
      }

      .nav-links {
        display: flex;
        gap: 25px;
      }

      .nav-item {
        cursor: pointer;
        text-transform: uppercase;
        font-size: 18px;
        font-weight: 700;
        color: var(--text-light);
        padding: 8px 15px;
        border-radius: 8px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .nav-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(0, 242, 255, 0.3),
          transparent
        );
        transition: 0.5s;
      }

      .nav-item:hover::before {
        left: 100%;
      }

      .nav-item:hover {
        color: var(--neon-blue);
        text-shadow: 0 0 8px var(--neon-blue);
      }

      .nav-item.active {
        color: var(--neon-pink);
        background: var(--glass-bg);
        border: 1px solid var(--neon-pink);
        text-shadow: 0 0 10px var(--neon-pink);
        box-shadow: 0 0 15px rgba(255, 0, 127, 0.5);
      }

      .status-indicator {
        display: inline-block;
        width: 10px;
        height: 10px;
        background-color: #0f0;
        border-radius: 50%;
        margin-left: 10px;
        box-shadow: 0 0 8px #0f0;
        animation: pulse-status 1.5s infinite alternate;
      }

      @keyframes pulse-status {
        from {
          box-shadow: 0 0 5px #0f0;
        }
        to {
          box-shadow: 0 0 15px #0f0;
        }
      }

      /* ================================================= */
      /* Home Page Specific Styles */
      .home-container {
        flex-grow: 1; /* Make it take available vertical space */
        display: flex;
        align-items: center; /* Center vertically */
        justify-content: center; /* Center horizontally */
        padding: 20px;
        text-align: center;
      }

      .home-content-box {
        background: rgba(0, 0, 0, 0.5); /* Darker glass effect */
        border: 1px solid rgba(0, 242, 255, 0.3);
        border-radius: 15px;
        padding: 40px 60px;
        box-shadow:
          0 0 25px rgba(0, 242, 255, 0.2),
          0 0 40px rgba(255, 0, 127, 0.1);
        max-width: 800px; /* Constrain width */
        text-align: center;
        animation: fadeIn 1.5s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .project-main-title {
        font-family: "Montserrat", sans-serif;
        font-size: 4.5vw; /* Responsive font size */
        /* color: var(--neon-blue);
        text-shadow: 0 0 15px var(--neon-blue); */
        /* color: #a2d2ff;
        text-shadow: 0 0 10px rgba(162, 210, 255, 0.5);  */
        /* color: #e0e1dd;
        text-shadow: 0 0 8px rgba(224, 225, 221, 0.4); */
        color: #f2f2f2;
        text-shadow: 0 0 12px #84a59d4d;
        margin-bottom: 5px;
        line-height: 1.1; /* Adjust line height for large text */
        animation: glow 2s infinite alternate;
      }

      @keyframes glow {
        from {
          text-shadow:
            0 0 10px var(--neon-blue),
            0 0 20px var(--neon-blue);
        }
        to {
          text-shadow:
            0 0 15px var(--neon-blue),
            0 0 25px var(--neon-blue);
        }
      }

      .project-subtitle-text {
        font-family: "Cairo", sans-serif;
        font-size: 1.5vw; /* Responsive font size */
        color: var(--text-light);
        opacity: 0.8;
        margin-bottom: 30px; /* Space below subtitle */
      }

      .member-details p {
        font-family: "Cairo", sans-serif;
        font-size: 1.8vw; /* Responsive font size */
        color: #fff; /* Pure white for clarity */
        margin: 10px 0; /* Spacing between lines */
        line-height: 1.5;
        opacity: 0.9;
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .project-main-title {
          font-size: 8vw;
        }
        .project-subtitle-text,
        .member-details p {
          font-size: 3vw;
        }
        .navbar {
          flex-direction: column;
          gap: 10px;
        }
        .nav-links {
          gap: 15px;
        }
      }

      /* ================================================= */
      /* General content display styles */
      .content-area {
        flex-grow: 1;
        padding: 20px;
        display: flex;
        justify-content: center; /* Center content horizontally */
        align-items: flex-start; /* Align content to the top initially */
        z-index: 1;
        position: relative;
      }

      .glass-card {
        background: var(--glass-bg);
        border: var(--border-neon);
        border-radius: 15px;
        padding: 25px;
        margin-bottom: 20px;
        box-shadow: var(--shadow-neon);
        backdrop-filter: blur(8px); /* Glass effect */
      }

      /* Override content-area alignment for home page specifically */
      .content-area.home-active {
        align-items: center; /* Center vertically ONLY when home is active */
      }
      /* تنسيقات صفحة Overview */
      /* حاوية الصورة لتسمح بوضع الأزرار فوقها */
      .map-interactive-container {
        position: relative;
        display: inline-block;
        width: 100%;
      }

      /* تنسيق الزر العائم */
      .map-label {
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        z-index: 10;
        transition: all 0.3s ease;
      }

      .label-text {
        background: rgba(15, 15, 18, 0.85); /* خلفية داكنة متناسقة */
        border: 1px solid var(--border-gold);
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        color: white;
        white-space: nowrap;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
      }

      /* تأثير النقطة النابضة */
      .pulse-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        position: relative;
      }

      .pulse-dot.admin {
        background: var(--neon-blue);
      } /* ذهبي */
      .pulse-dot.games {
        background: var(--neon-pink);
      } /* خزامي */
      .pulse-dot.maint {
        background: #64ffda;
      }

      .pulse-dot::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: inherit;
        border-radius: 50%;
        animation: pulse-ring 1.5s cubic-bezier(0.455, 0.03, 0.515, 0.955)
          infinite;
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.33);
          opacity: 1;
        }
        80%,
        100% {
          transform: scale(3);
          opacity: 0;
        }
      }

      /* تفاعل عند تمرير الماوس */
      .map-label:hover {
        transform: scale(1.1);
      }

      .map-label:hover .label-text {
        border-color: white;
        box-shadow: 0 0 15px var(--neon-blue);
      }
      .overview-grid {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr; /* الخريطة تأخذ مساحة أكبر */
        gap: 25px;
        margin-top: 30px;
      }

      .section-title {
        color: var(--neon-blue); /* الذهبي */
        font-size: 1.4rem;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-gold);
        padding-bottom: 10px;
      }

      .map-wrapper {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 15px;
        padding: 15px;
        text-align: center;
      }

      .overview-img {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.2));
      }

      .legend-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
      }

      .legend-item {
        font-size: 0.9rem;
        color: var(--text-light);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }
      .admin {
        background: #d4af37;
      } /* ذهبي */
      .games {
        background: #967bb6;
      } /* خزامي */
      .maint {
        background: #64ffda;
      } /* لون إضافي هادئ */

      .chart-container {
        height: 300px;
        position: relative;
      }

      .tech-note {
        background: rgba(150, 123, 182, 0.1); /* خلفية خزامية شفافة جداً */
        padding: 15px;
        border-radius: 10px;
        margin-top: 15px;
        border-right: 4px solid var(--neon-pink);
        font-size: 0.85rem;
      }
      /* تنسيقات صفحة المخطط الهندسي */
      .topology-container {
        padding: 10px;
        border: 1px solid var(--border-gold);
        overflow: hidden;
        position: relative;
        background: rgba(0, 0, 0, 0.4);
      }

      .topology-img {
        width: 100%;
        height: auto;
        filter: brightness(0.8) contrast(1.2); /* تجعل الصورة تبدو أكثر سينمائية */
        border-radius: 10px;
      }

      .topo-label {
        position: absolute;
        z-index: 20;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .label-box {
        background: rgba(26, 26, 32, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border-gold);
        padding: 10px 18px;
        border-radius: 12px;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      }

      .label-box b {
        color: var(--neon-blue); /* الذهبي */
        font-size: 1rem;
        display: block;
      }

      .label-box small {
        color: var(--neon-pink); /* الخزامي */
        font-size: 0.75rem;
        margin-top: 2px;
      }

      /* نمط خاص بـ ISP Core */
      .isp-style {
        border-color: #64ffda;
        background: rgba(100, 255, 218, 0.1);
      }

      .isp-style b {
        color: #64ffda;
      }

      /* نقطة الحالة */
      .status-dot {
        width: 8px;
        height: 8px;
        background: #0f0;
        border-radius: 50%;
        margin-bottom: 5px;
        box-shadow: 0 0 8px #0f0;
      }

      .blink {
        animation: blinker 1s linear infinite;
      }
      @keyframes blinker {
        50% {
          opacity: 0;
        }
      }

      .topo-label:hover {
        transform: scale(1.1) translateY(-5px);
        z-index: 30;
      }
      .topology-grid {
        display: flex;
        flex-direction: column;
        gap: 30px;
        padding-bottom: 50px;
      }

      .topology-section {
        position: relative;
        border: 1px solid var(--border-gold);
        background: rgba(0, 0, 0, 0.3);
        padding: 20px;
        border-radius: 20px;
      }

      .topology-img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        opacity: 0.9;
        transition: opacity 0.3s;
      }

      .topology-img:hover {
        opacity: 1;
      }

      /* تعديلات الأزرار لتكون أصغر وأكثر دقة */
      .label-box {
        padding: 8px 12px;
        font-size: 0.85rem;
        min-width: 150px;
      }

      .status-dot.blink {
        background: #00f2ff;
        box-shadow: 0 0 10px #00f2ff;
      }
      /* تنسيق الجداول الذهبية */
      .addressing-container {
        display: flex;
        flex-direction: column;
        gap: 40px;
        padding: 20px;
      }

      .table-section {
        animation: slideUp 0.8s ease-out;
      }

      .table-title {
        color: var(--neon-pink); /* خزامي */
        font-size: 1.2rem;
        margin-bottom: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .gold-table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255, 255, 255, 0.02);
        border-radius: 10px;
        overflow: hidden;
        color: #e0e0e0;
      }

      .gold-table th {
        background: rgba(212, 175, 55, 0.15); /* ذهبي خفيف */
        color: var(--neon-blue); /* ذهبي مطفي */
        padding: 15px;
        text-align: left;
        border-bottom: 2px solid var(--border-gold);
        font-family: "Montserrat", sans-serif;
        text-transform: uppercase;
        font-size: 0.85rem;
      }

      .gold-table td {
        padding: 12px 15px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.9rem;
      }

      .gold-table tbody tr:hover {
        background: rgba(150, 123, 182, 0.05); /* توهج خزامي عند التمرير */
        transition: 0.3s;
      }

      .gold-table td:first-child {
        font-weight: bold;
        color: #fff;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .config-detailed-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
        gap: 25px;
        padding-bottom: 40px;
      }

      .config-block {
        border-right: 4px solid var(--neon-blue); /* خط ذهبي جانبي */
        display: flex;
        flex-direction: column;
      }

      .config-h {
        color: var(--neon-blue);
        font-size: 1.15rem;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        padding-bottom: 8px;
      }

      .tech-desc {
        font-size: 0.9rem;
        color: #b0b0b0;
        margin-bottom: 15px;
        line-height: 1.5;
      }

      .code-window {
        background: #050505;
        color: #e0e0e0;
        padding: 18px;
        border-radius: 12px;
        font-family: "Fira Code", "Courier New", monospace;
        font-size: 0.82rem;
        position: relative;
        border: 1px solid #1a1a1a;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 1);
        direction: ltr;
      }

      .comment {
        color: #6a9955;
        font-style: italic;
      }
      .highlight-cmd {
        color: var(--neon-pink);
        font-weight: bold;
      }

      .code-window::after {
        content: "Cisco IOS";
        position: absolute;
        top: 5px;
        right: 15px;
        font-size: 0.6rem;
        color: #444;
      }
      /* التنسيق المعدل للصور داخل الكروت */
      .image-wrapper {
        width: 100%;
        height: 200px; /* تحديد ارتفاع ثابت لمنطقة الصورة */
        overflow: hidden; /* إخفاء أي جزء خارج الإطار */
        border: 1px solid rgba(0, 243, 255, 0.2);
        border-radius: 8px;
        margin: 10px 0;
        background: #000;
      }

      .dashboard-img,
      .sub-img {
        width: 100%;
        height: 100%;
        object-fit: contain; /* تجعل الصورة تظهر كاملة داخل الإطار دون تمطيط أو تغطية النص */
        display: block;
      }

      /* لتنسيق الكروت بحيث لا يتداخل النص مع الصور */
      .service-sub-card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 15px;
        min-height: 320px; /* ضمان مساحة كافية للنص والصورة معاً */
      }

      .service-p,
      .img-note {
        font-size: 0.85rem;
        line-height: 1.4;
        margin-bottom: 10px;
        z-index: 2; /* لضمان بقاء الخط فوق أي خلفية */
      }

      /* تحسين صور الإثبات النهائي */
      .final-proof-img {
        max-width: 100%;
        max-height: 150px;
        object-fit: cover;
        border-radius: 4px;
      }
      .result-item {
        display: flex;
        align-items: center;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 10px;
        background: rgba(255, 255, 255, 0.03);
      }
      .result-item.success {
        border-left: 5px solid #84a59d4d;
      }
      .result-item.blocked {
        border-left: 5px solid #84a59d4d;
      }
      .status-icon {
        font-size: 1.5rem;
        margin-right: 15px;
      }
      .result-info strong {
        display: block;
        color: var(--neon-blue);
      }
      .terminal-logs {
        max-height: 200px;
        overflow-y: auto;
        font-size: 0.8rem;
      }
      .conclusion-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      .achievement-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 15px;
        margin-top: 25px;
      }

      .achieve-item {
        background: rgba(255, 255, 255, 0.03);
        padding: 15px;
        border-radius: 10px;
        border: 1px solid rgba(0, 243, 255, 0.1);
        text-align: center;
      }

      .achieve-icon {
        font-size: 2rem;
        margin-bottom: 10px;
        display: block;
      }
      .achieve-item h4 {
        color: var(--neon-blue);
        font-size: 0.9rem;
        margin-bottom: 5px;
      }
      .achieve-item p {
        font-size: 0.75rem;
        color: #aaa;
      }

      .status-list {
        list-style: none;
        padding: 0;
        margin-top: 15px;
      }
      .status-list li {
        font-size: 0.85rem;
        padding: 8px 0;
        border-bottom: 1px solid #222;
        color: #ddd;
      }

      .pulse-green {
        height: 12px;
        width: 12px;
        background-color: #00ff00;
        border-radius: 50%;
        display: inline-block;
        box-shadow: 0 0 10px #00ff00;
        margin-right: 10px;
      }

      .final-quote {
        text-align: center;
        margin-top: 40px;
        font-size: 1.1rem;
        color: var(--border-gold);
        font-style: italic;
        border-top: 1px solid #333;
        padding-top: 20px;
      }
      .pulse-green {
        width: 12px;
        height: 12px;
        background: #0f0;
        border-radius: 50%;
        box-shadow: 0 0 10px #0f0;
        animation: pulse 1.5s infinite;
      }
      @keyframes pulse {
        0% {
          transform: scale(0.9);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.2);
          opacity: 1;
        }
        100% {
          transform: scale(0.9);
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-text">Dreamland Therme Park</div>
      <div class="nav-links">
        <div class="nav-item active" onclick="loadContent('home')">home</div>
        <div class="nav-item" onclick="loadContent('overview')">overview</div>
        <div class="nav-item" onclick="loadContent('topology')">topology</div>
        <div class="nav-item" onclick="loadContent('addressing')">
          addressing
        </div>
        <div class="nav-item" onclick="loadContent('config')">config</div>
        <div class="nav-item" onclick="loadContent('services')">
          Advanced Network Services
        </div>
        <div class="nav-item" onclick="loadContent('testing')">testing</div>
        <div class="nav-item" onclick="loadContent('conclusion')">
          conclusion
        </div>
      </div>
      <div style="font-size: 14px">
        <span class="status-indicator"></span> Network Online
      </div>
    </nav>

    <div id="content-area" class="content-area home-active">
      <div id="content-display"></div>
    </div>

    <script>
      const content = {
        home: `

    <div class="page-header">
        <h2 class="page-main-title">Comprehensive Configuration Manual</h2>
        <p class="page-subtitle">التوثيق البرمجي الكامل لبروتوكولات التوجيه والحماية لشبكة Dreamland</p>
    </div>

    <div class="config-detailed-grid">
        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-key"></i> 01. Infrastructure & AAA Management</h3>
            <div class="tech-desc">
                تم تفعيل نظام <b>AAA</b> لضمان أن الدخول للراوترات لا يتم إلا عبر حسابات معرفة، مع تشفير RSA بطول <b>1024-bit</b> لتأمين اتصال الـ SSH.
            </div>
            <div class="code-window">
                <span class="comment">! تفعيل التشفير والوصول الآمن</span><br>
                crypto key generate rsa (1024)<br>
                ip ssh version 2<br>
                aaa new-model<br>
                username admin_boss privilege 15 secret admin1
            </div>
        </div>

        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-share"></i> 02. Hybrid Routing Strategy</h3>
            <div class="tech-desc">
                استخدمنا <b>RIPv2</b> للربط الديناميكي، مع تقنية <b>Redistribution</b> لدمج المسارات الثابتة (Static) القادمة من شبكة الصيانة داخل جدول التوجيه العام.
            </div>
            <div class="code-window">
                <span class="comment">! دمج المسارات الثابتة مع RIP</span><br>
                router rip<br>
                version 2 | no auto-summary<br>
                network 192.168.10.0<br>
                redistribute static <span class="highlight-cmd">! Injecting Static routes into RIP process</span>
            </div>
        </div>

        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-layers"></i> 03. VLAN Segmentation (Router on a Stick)</h3>
            <div class="tech-desc">
                تم تقسيم شبكة الألعاب إلى <b>VLAN 10</b> للتذاكر و <b>VLAN 20</b> للتحكم، وتم الربط بينهما عبر الـ Sub-interfaces في الراوتر.
            </div>
            <div class="code-window">
                <span class="comment">! إعداد الـ Sub-interfaces</span><br>
                interface fa0/1.10<br>
                encapsulation dot1Q 10<br>
                ip address 192.168.10.1 255.255.255.0
            </div>
        </div>

        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-shield"></i> 04. Advanced Access Control (ACL)</h3>
            <div class="tech-desc">
                استخدمنا الـ <b>Extended ACL</b> ليس فقط للمنع، بل لتخصيص الوصول. (مثال: السماح للصيانة بالوصول للتحكم ومنعهم من السيرفر).
            </div>
            <div class="code-window">
                ip access-list extended CONTROL<br>
                permit ip 192.168.20.0 0.0.0.255 172.16.0.0 0.0.255.255<br>
                deny ip 192.168.20.0 0.0.0.255 192.168.30.0 0.0.0.255
            </div>
        </div>

        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-cpu"></i> 05. Layer 2 Security (Port-Security)</h3>
            <div class="tech-desc">
                لحماية المنافذ من هجمات الـ MAC Flooding، تم قفل المنافذ على أجهزة معينة (Sticky) وتفعيل خاصية الـ <b>Shutdown</b> الفوري عند المخالفة.
            </div>
            <div class="code-window">
                switchport mode access<br>
                switchport port-security<br>
                switchport port-security mac-address sticky<br>
                switchport port-security violation shutdown
            </div>
        </div>

        <div class="glass-card config-block">
            <h3 class="config-h"><i class="icon-cloud"></i> 06. DHCP & DNS Services</h3>
            <div class="tech-desc">
                إعداد السيرفر المركزي لتقديم خدمات الـ <b>IP Discovery</b> والترجمة البرمجية لأسماء النطاقات المحلية.
            </div>
            <div class="code-window">
                ip dhcp excluded-address 192.168.30.1 192.168.30.10<br>
                ip dhcp pool ADMIN_POOL<br>
                network 192.168.30.0 255.255.255.0
            </div>
        </div>
    </div>

                <div style="font-weight: bold; font-size: 1.1rem;">العصماء حلاق</div>
                <div style="font-weight: bold; font-size: 1.1rem; margin-top: 5px;">إيلاف الحليلي</div>
                <div style="font-size: 0.8rem; color: #888; margin-top: 15px;">تحت إشراف المهندس /أنور.</div>
            </div>
        </div>
    </div>

`,
      };

      function loadContent(page) {
        const contentDisplay = document.getElementById("content-display");
        const navItems = document.querySelectorAll(".nav-item");
        const contentArea = document.getElementById("content-area");

        // Remove active class from all nav items
        navItems.forEach((item) => item.classList.remove("active"));

        // Add active class to the clicked nav item
        document
          .querySelector(`.nav-item[onclick="loadContent('${page}')"]`)
          .classList.add("active");

        // Update content
        contentDisplay.innerHTML = content[page];

        // Adjust content-area alignment based on page
        if (page === "home") {
          contentArea.classList.add("home-active");
        } else {
          contentArea.classList.remove("home-active");
        }

        // If a chart needs to be rendered, call the function
        if (page === "overview") {
          // Assuming you have a function to render your chart
          renderMainChart();
        }
      }

      // Load home page on initial load
      window.onload = () => loadContent("home");

      // Placeholder for chart rendering (make sure this is defined elsewhere if needed)
      function renderMainChart() {
        const ctx = document.getElementById("trafficChart").getContext("2d");

        // تعريف الألوان لتناسب الهوية الجديدة (ذهبي، خزامي، فضي)
        const colorGold = "#d4af37";
        const colorLavender = "#967bb6";
        const colorSilver = "#778da9";

        new Chart(ctx, {
          type: "doughnut",
          data: {
            labels: ["منطقة الألعاب", "مبنى الإدارة", "قسم الصيانة"],
            datasets: [
              {
                data: [55, 30, 15], // النسب "الواقعية" بناءً على توزيع أجهزتك
                backgroundColor: [colorLavender, colorGold, colorSilver],
                hoverOffset: 15,
                borderWidth: 0, // إزالة الحدود لجعل الشكل أكثر سلاسة
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: "70%", // يجعل الحلقة نحيفة وأنيقة
            plugins: {
              legend: {
                position: "bottom",
                labels: {
                  color: "#f0f0f0",
                  font: { family: "Cairo", size: 14 },
                  padding: 20,
                },
              },
            },
          },
        });
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
